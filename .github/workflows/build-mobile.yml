name: Build Movil (Android APK release)

on:
  workflow_dispatch:
  push:
    tags:
      - "movil-v*"

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm ci

      - name: Generar proyecto nativo Android (prebuild)
        run: npx expo prebuild -p android --clean --no-install
        env:
          CI: 1
          EXPO_NO_TELEMETRY: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Compilar APK release (incluye bundle JS)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      # ── Firma del APK ────────────────────────────────────────────────
      # Sin firma válida Android rechaza la instalación con
      # "Aplicación no instalada".
      - name: Firmar APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Decodificar el keystore desde el secret
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore

          APK_UNSIGNED="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          APK_RELEASE="android/app/build/outputs/apk/release/app-release.apk"

          # Gradle puede generar el APK con cualquiera de los dos nombres
          if [ -f "$APK_RELEASE" ]; then
            INPUT_APK="$APK_RELEASE"
          elif [ -f "$APK_UNSIGNED" ]; then
            INPUT_APK="$APK_UNSIGNED"
          else
            echo "❌ No se encontró ningún APK en android/app/build/outputs/apk/release/"
            ls -la android/app/build/outputs/apk/release/ || true
            exit 1
          fi

          # Zipalign para optimización
          "${ANDROID_HOME}/build-tools/$(ls ${ANDROID_HOME}/build-tools/ | tail -1)/zipalign" -v 4 \
            "$INPUT_APK" /tmp/app-aligned.apk

          # Firmar con apksigner
          "${ANDROID_HOME}/build-tools/$(ls ${ANDROID_HOME}/build-tools/ | tail -1)/apksigner" sign \
            --ks /tmp/release.keystore \
            --ks-pass "pass:${KEYSTORE_PASSWORD}" \
            --ks-key-alias "${KEY_ALIAS}" \
            --key-pass "pass:${KEY_PASSWORD}" \
            --out /tmp/app-signed.apk \
            /tmp/app-aligned.apk

          # Verificar la firma
          "${ANDROID_HOME}/build-tools/$(ls ${ANDROID_HOME}/build-tools/ | tail -1)/apksigner" verify \
            --print-certs /tmp/app-signed.apk

          echo "✅ APK firmado exitosamente"

      - name: Preparar APK
        run: |
          mkdir -p dist-apk
          cp /tmp/app-signed.apk dist-apk/VCDetection-movil.apk

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: VCDetection-APK
          path: mobile/dist-apk/VCDetection-movil.apk
          if-no-files-found: error

      - name: Publicar en GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('movil-v{0}', github.run_number) }}
          name: VCDetection App Movil ${{ github.ref_type == 'tag' && github.ref_name || format('movil-v{0}', github.run_number) }}
          body: APK release firmado con bundle JS incluido. Instalar directamente en Android.
          files: mobile/dist-apk/VCDetection-movil.apk
          make_latest: true

      # Release fijo "latest": mantiene siempre la última versión de cada app,
      # para que el botón de descarga de la página web nunca se rompa.
      - name: Publicar en release latest (link estable)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Descargas estables (última versión)
          body: Última versión estable de cada aplicación. Descarga directa desde la página del proyecto.
          files: mobile/dist-apk/VCDetection-movil.apk
